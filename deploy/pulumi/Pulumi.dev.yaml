# Dev stack config. Plain, non-secret values only. Secrets live in Key
# Vault and are set out-of-band via `az keyvault secret set`. See
# deploy/pulumi/README.md for the operator workflow.
config:
  # UK South to keep latency low for UK users and stay in-region with the
  # operator's other infra. Don't change after first deploy.
  azure-native:location: uksouth
  cal:stateStorageAccountId: /subscriptions/cc2d669d-282e-4fe7-a425-b60578ddc08e/resourceGroups/cal-state-rg/providers/Microsoft.Storage/storageAccounts/calstatea15b96
  cal:stateKeyVaultId: /subscriptions/cc2d669d-282e-4fe7-a425-b60578ddc08e/resourceGroups/cal-state-rg/providers/Microsoft.KeyVault/vaults/cal-state-kv-9f4dd7
  cal:githubRepo: omairnabiel/cal.diy
secretsprovider: azurekeyvault://cal-state-kv-9f4dd7.vault.azure.net/keys/pulumi-secrets
encryptedkey: 

# Set these after running scripts/bootstrap-pulumi-backend.sh:
#   cal:stateStorageAccountId: /subscriptions/.../storageAccounts/calpulumistate<rand>
#   cal:stateKeyVaultId:       /subscriptions/.../vaults/cal-pulumi-state-kv-<rand>
#
# Trust the Cal fork's GitHub Actions to mint Azure OIDC tokens:
#   cal:githubRepo: omairnabiel/cal.diy
#
# Per-app image refs. CI sets these via `pulumi config set` after pushing
# images to ACR. Defaults to a placeholder so a first `pulumi up`
# succeeds even before any build has run.
#   cal:calWebImage: <acr>.azurecr.io/cal-web:<sha>
#   cal:calApiImage: <acr>.azurecr.io/cal-api:<sha>
