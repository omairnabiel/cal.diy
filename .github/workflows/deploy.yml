# Deploy — runs on push to `develop`. Builds the two Cal images, pushes
# them to Cal's own ACR, then `pulumi up`s the standalone Cal stack with
# the new image refs.
#
# This is Cal's OWN Pulumi stack (deploy/pulumi/, project name `cal`).
# It is completely independent of any other repo — Wavey integrates with
# Cal via its public URL + per-tenant API key, not via shared infra.
#
# One-time setup in the fork:
#
#   Secrets (Settings → Secrets and variables → Actions):
#     AZURE_CLIENT_ID          User-Assigned Managed Identity client ID
#                              from Cal's stack (pulumi stack output
#                              identityClientId after first `pulumi up`)
#     AZURE_TENANT_ID          Azure AD tenant id
#     AZURE_SUBSCRIPTION_ID    Subscription containing cal-dev-rg
#
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     PULUMI_BACKEND_STORAGE_ACCOUNT   from scripts/bootstrap-pulumi-backend.sh
#     PULUMI_BACKEND_CONTAINER         "state" by default
#
#   Cal's Pulumi stack must be initialized once locally:
#     ./scripts/bootstrap-pulumi-backend.sh
#     pulumi login azblob://state?storage_account=<account>
#     cd deploy/pulumi
#     pulumi stack init dev
#     pulumi config set cal:stateStorageAccountId <id>
#     pulumi config set cal:stateKeyVaultId <id>
#     pulumi config set cal:githubRepo omairnabiel/cal.diy
#     pulumi up
#   After that first apply, the federated identity exists and CI works.

name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cal-deploy-dev
  cancel-in-progress: false

env:
  STACK: dev
  IMAGE_TAG: ${{ github.sha }}
  # Pulumi state backend (Azure Blob, NOT Pulumi Cloud)
  PULUMI_BACKEND_URL: "azblob://${{ vars.PULUMI_BACKEND_CONTAINER || 'state' }}?storage_account=${{ vars.PULUMI_BACKEND_STORAGE_ACCOUNT }}"
  AZURE_KEYVAULT_AUTH_VIA_CLI: "true"
  # Pulumi azure-native provider auth (OIDC)
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Build + push the two Cal images in parallel. Each tagged with the
  # commit SHA + a moving :develop tag. Pulumi reads only the SHA tag.
  # ───────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: cal-web, dockerfile: Dockerfile,        image: cal-web }
          - { name: cal-api, dockerfile: Dockerfile.api-v2, image: cal-api }
    outputs:
      acr-login-server: ${{ steps.acr.outputs.login-server }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write OIDC token for Azure SDK
        run: |
          curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$RUNNER_TEMP/oidc-token"
          echo "AZURE_FEDERATED_TOKEN_FILE=$RUNNER_TEMP/oidc-token" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - name: Install Pulumi deps
        working-directory: deploy/pulumi
        run: npm ci --omit=dev --silent

      - name: Read ACR login server from Pulumi state
        id: acr
        working-directory: deploy/pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi login "$PULUMI_BACKEND_URL"
          login_server=$(pulumi --stack ${{ env.STACK }} stack output acrLoginServer)
          echo "login-server=$login_server" >> $GITHUB_OUTPUT

      - name: Docker login to ACR
        run: |
          acr_token=$(az acr login --name "${{ steps.acr.outputs.login-server }}" --expose-token --query accessToken -o tsv)
          docker login "${{ steps.acr.outputs.login-server }}" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin <<<"$acr_token"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.acr.outputs.login-server }}/${{ matrix.service.image }}:${{ env.IMAGE_TAG }}
            ${{ steps.acr.outputs.login-server }}/${{ matrix.service.image }}:develop
          # Build-time placeholders. Runtime values come from Container
          # Apps env (sourced from Key Vault).
          build-args: |
            DATABASE_URL=postgresql://placeholder:placeholder@placeholder:5432/placeholder
            NEXTAUTH_SECRET=build-time-placeholder
            CALENDSO_ENCRYPTION_KEY=build-time-placeholder-32-bytes!
            CALCOM_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_LICENSE_CONSENT=
            NEXT_PUBLIC_WEBSITE_TERMS_URL=
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=
            NEXT_PUBLIC_SINGLE_ORG_SLUG=
            ORGANIZATIONS_ENABLED=
            CSP_POLICY=
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

  # ───────────────────────────────────────────────────────────────────────
  # Set the new image refs in Pulumi config, run pulumi up.
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/pulumi/package-lock.json

      - name: Install Pulumi deps
        working-directory: deploy/pulumi
        run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write OIDC token for Azure SDK
        run: |
          curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$RUNNER_TEMP/oidc-token"
          echo "AZURE_FEDERATED_TOKEN_FILE=$RUNNER_TEMP/oidc-token" >> $GITHUB_ENV

      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Pulumi login (Azure Blob backend)
        working-directory: deploy/pulumi
        run: pulumi login "$PULUMI_BACKEND_URL"

      - name: Set Cal image tags in Pulumi config
        working-directory: deploy/pulumi
        run: |
          ACR=${{ needs.build.outputs.acr-login-server }}
          SHA=${{ env.IMAGE_TAG }}
          pulumi --stack ${{ env.STACK }} config set cal:calWebImage "$ACR/cal-web:$SHA"
          pulumi --stack ${{ env.STACK }} config set cal:calApiImage "$ACR/cal-api:$SHA"

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.STACK }}
          work-dir: deploy/pulumi
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
          comment-on-pr: false

      - name: Print deployed URLs
        working-directory: deploy/pulumi
        run: |
          echo "Deployed Cal!"
          echo "  cal-web: $(pulumi --stack ${{ env.STACK }} stack output calWebUrl)"
          echo "  cal-api: $(pulumi --stack ${{ env.STACK }} stack output calApiInternalFqdn)"
